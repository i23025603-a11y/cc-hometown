<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Document</title>

<style>
.box {
    position: relative;
    width: 800px;
    height: 300px;
    background: transparent;
}
</style>

<style>
body {
    width: 100%;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
}
</style>

<style>
iframe { width: 100%; height: 100vh; border: none; }
</style>

</head>

<body>

<div class="box">
    <iframe src="index2.xhtml"></iframe>
</div>

</body>
</html>
